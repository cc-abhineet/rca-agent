logs:
  - type: file
    path: /var/log/pricing-service/app.log
    service: pricing-service
    source: java
    sourcecategory: sourcecode
    tags:
      - env:dev
    log_processing_rules:
      - type: multi_line
        name: java_log_start_with_date
        pattern: \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}
