version: "2.0"

# ═══════════════════════════════════════════════════════════════════════════════
# projects.yaml — Single source of truth for every service this platform monitors
#
# HOW TO ADD A NEW SERVICE (no code changes required):
#   1. Add an entry below with id, github_org, github_repo, language, etc.
#   2. Set observability_mode: db  and  log_path: /path/to/your/app.log
#   3. Run: python add_service_map.py          (registers GitHub repo in DB)
#   4. Mount the log volume in docker-compose ingestion-agent section
#   5. Run: docker compose up --build          (agent auto-discovers new entry)
#
# SUPPORTED LANGUAGES:  java | python | nodejs | go | generic
# OBSERVABILITY MODES:  db (tail log file) | datadog (Datadog Logs API)
# ═══════════════════════════════════════════════════════════════════════════════

projects:

  # ── Banking App ──────────────────────────────────────────────────────────────
  - id: banking-app
    name: "Banking App"
    description: "Spring Boot banking application with account management and transactions"
    github_org: apollo
    github_repo: banking-app
    default_branch: main
    language: java
    environment: dev
    observability_mode: db          # tail log file → error_logs table
    log_path: /var/log/banking-app/app.log

    datadog:
      service_name: banking-app
      env: dev
      monitor_ids: []

    chaos_endpoint: http://banking-app:8080/chaos

  # ── Pricing Service ──────────────────────────────────────────────────────────
  - id: pricing-service
    name: "Pricing Service"
    description: "Spring Boot pricing engine. v2.1.0 renamed 'discount' → 'discountRate'."
    github_org: apollo
    github_repo: pricing-service
    default_branch: main
    language: java
    environment: dev
    observability_mode: datadog     # switch to db + add log_path to watch locally
    log_path: /var/log/pricing-service/app.log

    datadog:
      service_name: pricing-service
      env: dev
      monitor_ids: []

    chaos_endpoint: http://pricing-service:8081/chaos

  # ── Order Service ────────────────────────────────────────────────────────────
  - id: order-service
    name: "Order Service"
    description: "Spring Boot order service. Calls pricing-service. Contains Bug A + Bug B."
    github_org: apollo
    github_repo: order-service
    default_branch: main
    language: java
    environment: dev
    observability_mode: datadog     # switch to db + add log_path to watch locally
    log_path: /var/log/order-service/app.log

    datadog:
      service_name: order-service
      env: dev
      monitor_ids: []

    chaos_endpoint: http://order-service:8082/chaos

  # ═══════════════════════════════════════════════════════════════════════════
  # EXAMPLE ENTRIES — uncomment and fill in to add your own services
  # ═══════════════════════════════════════════════════════════════════════════

