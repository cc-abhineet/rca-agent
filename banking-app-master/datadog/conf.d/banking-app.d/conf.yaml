logs:
  - type: file
    # Must match logback-spring.xml <file> path exactly.
    # logback writes to app.log (NOT banking-app.log).
    path: /var/log/banking-app/app.log
    service: banking-app
    source: java
    sourcecategory: sourcecode
    tags:
      - env:production
      - version:1.0.0
    # Datadog will auto-correlate these logs with APM traces
    # because dd.trace_id and dd.span_id are embedded in JSON
