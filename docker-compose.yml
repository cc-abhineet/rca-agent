# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Demo stack for the rca-agent platform
#
# One command brings everything up:
#   cp env.example env   # fill ANTHROPIC_API_KEY and GITHUB_PAT
#   docker compose up --build
#
# Then open http://localhost:8000/demo
#
# Ports:
#   8000  rca-agent     (FastAPI + Claude — the demo UI lives here)
#   8080  banking-app   (Spring Boot)
#   8081  pricing-service (Spring Boot, v2.1.0 — discountRate rename)
#   8082  order-service   (Spring Boot — Bug A + Bug B chaos endpoints)
# ─────────────────────────────────────────────────────────────────────────────

services:

  banking-app:
    build:
      context: ./banking-app-master
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
      SPRING_H2_CONSOLE_ENABLED: "false"
    networks:
      - rca-net
    restart: unless-stopped

  pricing-service:
    build:
      context: ./banking-app-master/pricing-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - rca-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/api/v1/pricing/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  order-service:
    build:
      context: ./banking-app-master/order-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PRICING_SERVICE_URL: "http://pricing-service:8081"
    depends_on:
      pricing-service:
        condition: service_healthy
    networks:
      - rca-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/v1/orders/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  rca-agent:
    build:
      context: ./banking-app-master/rca-agent
    ports:
      - "8000:8000"
    env_file: env        # ANTHROPIC_API_KEY, GITHUB_PAT, DATABASE_URL
    environment:
      OBSERVABILITY_ADAPTER: "local"
      CICD_ADAPTER: "mock"
      GITHUB_ORG: "oscorpAI"
      MODEL: "claude-sonnet-4-6"
      MAX_REACT_ITERATIONS: "35"
      RCA_POLL_ENABLED: "false"
      ORDER_SERVICE_URL: "http://order-service:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - rca-net
    restart: unless-stopped

networks:
  rca-net:
    driver: bridge
