# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Local full-stack demo for the rca-agent platform
#
# Single log file architecture:
#   ALL services write to /var/log/banking-app/app.log (one shared volume).
#   DD_LOGS_INJECTION=true on each service embeds dd.service=<name> in every
#   line so the ingestion-agent and Datadog can attribute each log correctly.
#
# One command brings everything up:
#   docker compose up --build
#
# Prerequisites:
#   Copy env.example → .env and fill in DD_API_KEY, ANTHROPIC_API_KEY, etc.
#
# Ports:
#   8080  banking-app      (Spring Boot)
#   8081  pricing-service  (Spring Boot)
#   8082  order-service    (Spring Boot)
#   5000  ui               (Flask — combined error-trigger dashboard, all services)
#   8000  rca-agent        (FastAPI — RCA dashboard at :8000/demo)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application services ────────────────────────────────────────────────────
  # All three services write to the SAME log file on the same named volume.
  # The /var/log/banking-app directory is created by banking-app at startup;
  # pricing-service and order-service append to the same file.

  banking-app:
    build:
      context: ./banking-app-master
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      LOGGING_FILE_NAME: "/var/log/banking-app/app.log"
      DD_SERVICE: "banking-app"
      DD_VERSION: "1.0.0"
      DD_ENV: "dev"
      DD_LOGS_INJECTION: "true"
    volumes:
      - app-logs:/var/log/banking-app
    networks:
      - rca-net
    restart: unless-stopped

  pricing-service:
    build:
      context: ./banking-app-master/pricing-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      LOGGING_FILE_NAME: "/var/log/banking-app/app.log"
      DD_SERVICE: "pricing-service"
      DD_VERSION: "2.1.0"
      DD_ENV: "dev"
      DD_LOGS_INJECTION: "true"
    volumes:
      - app-logs:/var/log/banking-app
    networks:
      - rca-net
    restart: unless-stopped

  order-service:
    build:
      context: ./banking-app-master/order-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PRICING_SERVICE_URL: "http://pricing-service:8081"
      LOGGING_FILE_NAME: "/var/log/banking-app/app.log"
      DD_SERVICE: "order-service"
      DD_VERSION: "1.0.0"
      DD_ENV: "dev"
      DD_LOGS_INJECTION: "true"
    volumes:
      - app-logs:/var/log/banking-app
    depends_on:
      - pricing-service
    networks:
      - rca-net
    restart: unless-stopped

  # ── Python agents ───────────────────────────────────────────────────────────
  # MySQL runs on the host, not in Docker. Containers reach it via
  # host.docker.internal (mapped to host-gateway so it works on Linux too).

  ingestion-agent:
    build:
      context: ./banking-app-master
      dockerfile: error-ingestion-agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://root:varun@host.docker.internal:3306/rca_db
      MODE: "db"
      LOG_FILE_PATHS: "/var/log/banking-app/app.log"
      SERVICE_NAME: "banking-app"
      ENVIRONMENT: "dev"
      # DD_API_KEY / DD_SITE come from .env.
      # When set, all log lines are shipped to Datadog in a background thread.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-logs:/var/log/banking-app:ro
    depends_on:
      - banking-app
      - pricing-service
      - order-service
    networks:
      - rca-net
    restart: unless-stopped

  rca-agent:
    build:
      context: ./banking-app-master/rca-agent
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://root:varun@host.docker.internal:3306/rca_db
      OBSERVABILITY_ADAPTER: "local"
      CICD_ADAPTER: "mock"
      GITHUB_ORG: "oscorpAI"
      MODEL: "claude-haiku-4-5-20251001"
      MAX_REACT_ITERATIONS: "8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - banking-app
      - pricing-service
      - order-service
      - ingestion-agent
    networks:
      - rca-net
    restart: unless-stopped

  # ── Datadog Agent — ships the shared log file to Datadog ────────────────────
  # Config is mounted at /etc/datadog-agent/conf.d (the agent's real conf path).
  # DD_API_KEY and DD_SITE are read from .env via env_file.
  # DD_LOGS_INJECTION=true on each app container embeds dd.service=<name> in
  # every log line so Datadog attributes each log to the correct service.
  dd-agent:
    image: gcr.io/datadoghq/agent:7
    env_file: .env
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      DD_APM_ENABLED: "false"
      DD_PROCESS_AGENT_ENABLED: "false"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "false"
      DD_LOGS_CONFIG_USE_HTTP: "true"
      DD_LOGS_CONFIG_BATCH_WAIT: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - app-logs:/var/log/banking-app:ro
      - ./datadog/conf.d:/etc/datadog-agent/conf.d:ro
    networks:
      - rca-net
    restart: unless-stopped

  # ── Demo UI ──────────────────────────────────────────────────────────────────
  # Combined error-trigger dashboard for all three services.
  # Live log stream + grouped chaos buttons + RCA trigger.
  # All services write to one shared log file so one UI instance covers all.

  ui:
    build:
      context: ./ui
    ports:
      - "5000:5000"
    environment:
      LOG_FILE_PATH: "/var/log/banking-app/app.log"
      RCA_AGENT_URL: "http://localhost:8000"
      BANKING_APP_HOST: "banking-app"
      PRICING_HOST: "pricing-service"
      ORDER_HOST: "order-service"
    env_file: .env
    volumes:
      - app-logs:/var/log/banking-app:ro
    depends_on:
      - banking-app
      - pricing-service
      - order-service
    networks:
      - rca-net
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
# One shared volume. All app containers write to it; agents and UIs read from it.
volumes:
  app-logs:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  rca-net:
    driver: bridge
